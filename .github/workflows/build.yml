# AutoDPI: builds the APK on every push and publishes it as the "latest" release
name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake (runner already has the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*universal*.apk out/AutoDPI.apk
          ls -la app/build/outputs/apk/debug/

      - name: Package Windows version
        run: |
          cd windows
          zip -qr ../out/AutoDPI-Windows.zip AutoDPI

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDPI
          path: |
            out/AutoDPI.apk
            out/AutoDPI-Windows.zip

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AutoDPI latest build
          body: |
            Automatic build from the latest commit.
            - **Android:** download `AutoDPI.apk` and install it on your phone.
            - **Windows 10/11:** download `AutoDPI-Windows.zip`, unzip it, edit `test_sites.txt`, then double-click `1_START.cmd`.
          prerelease: false
          make_latest: true
          files: |
            out/AutoDPI.apk
            out/AutoDPI-Windows.zip
